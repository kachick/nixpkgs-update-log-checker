name: ❄️ Diff
on:
  pull_request:
    paths:
      - 'flake.lock'

permissions:
  contents: read
  pull-requests: write

jobs:
  diff:
    uses: kachick/workflows/.github/workflows/reusable-nix-diff-closures.yml@main
    with:
      runs-on: ubuntu-26.04
      targets: |
        devShells.x86_64-linux.default
        packages.x86_64-linux.default
